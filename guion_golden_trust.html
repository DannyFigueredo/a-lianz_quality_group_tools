<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Script IUL — Golden Trust</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=DM+Mono&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #0d0f14;
      --node-bg: #13161d;
      --card-bg: #1a1e26;
      --accent: #c8a96e;
      --text: #e8eaf0;
      --muted: #6b7280;
      --line: rgba(200, 169, 110, 0.15);
      --obj: #e07b6a;
      --obj-line: rgba(224, 123, 106, 0.3);
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px);
    }

    body,
    html {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
      font-family: 'Outfit', sans-serif;
      color: var(--text);
      overflow: hidden;
    }

    #viewport {
      width: 100%;
      height: 100%;
      position: relative;
      display: block;
    }

    #map-canvas {
      position: absolute;
      width: 12000px;
      height: 8000px;
      transition: transform 0.8s cubic-bezier(0.2, 0, 0.2, 1);
    }

    .node {
      position: absolute;
      background: var(--node-bg);
      border: 1px solid var(--line);
      padding: 25px;
      border-radius: 16px;
      transition: all 0.5s ease;
      opacity: 0.1;
      transform: scale(0.9);
    }

    .node.active {
      opacity: 1;
      transform: scale(1);
      border-color: var(--accent);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }

    .card-tag {
      font-family: 'DM Mono';
      font-size: 10px;
      color: var(--accent);
      letter-spacing: 1px;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .objective {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .exec-note {
      font-family: 'DM Mono';
      font-size: 10px;
      color: var(--muted);
      margin-bottom: 4px;
      line-height: 1.5;
    }

    .exec-note::before {
      content: "▸ ";
      color: var(--accent);
    }

    .script-box {
      background: rgba(255, 255, 255, 0.03);
      padding: 15px;
      border-radius: 8px;
      border-left: 3px solid var(--accent);
      margin-bottom: 10px;
      margin-top: 12px;
    }

    .literal {
      font-size: 1.05rem;
      color: #fff;
      line-height: 1.5;
      display: block;
      margin-bottom: 8px;
    }

    .instruction {
      font-family: 'DM Mono';
      font-size: 10px;
      color: var(--accent);
      text-transform: uppercase;
      display: block;
      opacity: 0.8;
      margin-bottom: 4px;
    }

    .subphase-container {
      display: flex;
      gap: 15px;
      margin-top: 15px;
      align-items: flex-start;
    }

    .sub-card {
      background: var(--card-bg);
      border: 1px solid var(--line);
      padding: 15px;
      border-radius: 10px;
      flex: 1;
    }

    .nav-ui {
      position: fixed;
      bottom: calc(30px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 20px;
      z-index: 1000;
    }

    .nav-btn {
      background: #1a1e26;
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 10px 25px;
      border-radius: 50px;
      cursor: pointer;
      font-family: 'DM Mono';
      font-size: 12px;
      transition: 0.3s;
    }

    .nav-btn:hover {
      background: var(--accent);
      color: #000;
    }

    .q-item {
      font-size: 12px;
      color: #ccc;
      margin-bottom: 5px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding-bottom: 3px;
      line-height: 1.45;
    }

    .brand {
      position: fixed;
      top: calc(20px + env(safe-area-inset-top, 0px));
      left: 50%;
      transform: translateX(-50%);
      font-family: 'DM Mono';
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--muted);
      text-transform: uppercase;
      z-index: 1000;
    }

    /* ==========================================
       BANCO DE OBJECIONES — UI
       ========================================== */

    .obj-toggle {
      position: fixed;
      top: calc(20px + env(safe-area-inset-top, 0px));
      right: 20px;
      z-index: 1001;
      background: var(--node-bg);
      border: 1px solid var(--obj-line);
      color: var(--obj);
      padding: 10px 18px;
      border-radius: 50px;
      cursor: pointer;
      font-family: 'DM Mono';
      font-size: 11px;
      letter-spacing: 1px;
      transition: 0.3s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .obj-toggle:hover {
      background: var(--obj);
      border-color: var(--obj);
      color: #0d0f14;
    }

    .obj-count {
      background: rgba(224, 123, 106, 0.15);
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 10px;
    }

    .obj-toggle:hover .obj-count {
      background: rgba(0, 0, 0, 0.2);
    }

    .obj-panel {
      position: fixed;
      top: 0;
      right: 0;
      height: 100%;
      width: min(430px, 100vw);
      background: var(--node-bg);
      border-left: 1px solid var(--line);
      box-shadow: -30px 0 80px rgba(0, 0, 0, 0.55);
      transform: translateX(105%);
      transition: transform 0.45s cubic-bezier(0.2, 0, 0.2, 1);
      z-index: 1002;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    .obj-panel.open {
      transform: translateX(0);
    }

    .obj-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 22px 22px 14px;
    }

    .obj-header-title {
      font-family: 'DM Mono';
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--obj);
      text-transform: uppercase;
    }

    .obj-close {
      background: none;
      border: 1px solid var(--line);
      color: var(--muted);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 12px;
      line-height: 1;
      transition: 0.3s;
    }

    .obj-close:hover {
      color: var(--text);
      border-color: var(--obj);
    }

    .obj-search-wrap {
      padding: 0 22px 8px;
    }

    .obj-search {
      width: 100%;
      box-sizing: border-box;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--line);
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      padding: 12px 14px;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.3s;
    }

    .obj-search:focus {
      border-color: var(--obj);
    }

    .obj-search::placeholder {
      color: var(--muted);
    }

    .obj-hint {
      display: flex;
      justify-content: space-between;
      font-family: 'DM Mono';
      font-size: 9px;
      color: var(--muted);
      padding: 0 24px 10px;
      letter-spacing: 0.5px;
    }

    .obj-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 22px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .obj-list::-webkit-scrollbar {
      width: 6px;
    }

    .obj-list::-webkit-scrollbar-thumb {
      background: rgba(200, 169, 110, 0.2);
      border-radius: 3px;
    }

    .obj-item {
      text-align: left;
      background: var(--card-bg);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 14px;
      cursor: pointer;
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      transition: 0.25s;
      display: flex;
      gap: 12px;
      align-items: baseline;
    }

    .obj-item:hover {
      border-color: var(--obj);
      background: #1e232d;
    }

    .obj-num {
      font-family: 'DM Mono';
      font-size: 10px;
      color: var(--obj);
      flex-shrink: 0;
    }

    .obj-item-title {
      font-weight: 600;
      font-size: 13.5px;
      color: #fff;
      line-height: 1.35;
    }

    .obj-kws {
      font-family: 'DM Mono';
      font-size: 9px;
      color: var(--muted);
      margin-top: 4px;
      line-height: 1.5;
    }

    .obj-empty {
      font-family: 'DM Mono';
      font-size: 11px;
      color: var(--muted);
      text-align: center;
      padding: 30px 10px;
      line-height: 1.7;
    }

    .obj-footer {
      padding: 12px 22px;
      border-top: 1px solid var(--line);
      font-family: 'DM Mono';
      font-size: 9px;
      color: var(--muted);
      text-align: center;
      letter-spacing: 0.5px;
    }

    /* Modal */

    .obj-modal {
      position: fixed;
      inset: 0;
      background: rgba(13, 15, 20, 0.78);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
      z-index: 1003;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .obj-modal.open {
      opacity: 1;
      pointer-events: auto;
    }

    .obj-modal-card {
      position: relative;
      background: var(--node-bg);
      border: 1px solid var(--obj-line);
      border-radius: 18px;
      padding: 30px;
      max-width: 640px;
      width: 100%;
      max-height: 82vh;
      overflow-y: auto;
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.6);
      transform: translateY(10px) scale(0.98);
      transition: transform 0.25s ease;
    }

    .obj-modal.open .obj-modal-card {
      transform: none;
    }

    .obj-modal-card::-webkit-scrollbar {
      width: 6px;
    }

    .obj-modal-card::-webkit-scrollbar-thumb {
      background: rgba(224, 123, 106, 0.25);
      border-radius: 3px;
    }

    .obj-modal-tag {
      font-family: 'DM Mono';
      font-size: 10px;
      color: var(--obj);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .obj-modal-title {
      font-size: 1.45rem;
      font-weight: 600;
      color: #fff;
      line-height: 1.3;
      margin: 0 0 14px;
      padding-right: 36px;
    }

    .obj-meaning-label {
      font-family: 'DM Mono';
      font-size: 9px;
      color: var(--muted);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .obj-meaning {
      font-size: 13px;
      color: #b9bec9;
      line-height: 1.5;
      margin-bottom: 16px;
    }

    .obj-modal-kws {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 18px;
    }

    .kw-chip {
      font-family: 'DM Mono';
      font-size: 9px;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 3px 10px;
      letter-spacing: 0.5px;
    }

    .obj-response {
      background: rgba(255, 255, 255, 0.03);
      border-left: 3px solid var(--obj);
      border-radius: 8px;
      padding: 18px 20px;
    }

    .obj-response-label {
      font-family: 'DM Mono';
      font-size: 10px;
      color: var(--obj);
      text-transform: uppercase;
      letter-spacing: 1px;
      display: block;
      margin-bottom: 10px;
      opacity: 0.85;
    }

    .obj-response-text {
      font-size: 1.05rem;
      color: #fff;
      line-height: 1.65;
      white-space: pre-line;
    }

    .obj-modal-close {
      position: absolute;
      top: 18px;
      right: 18px;
      background: none;
      border: 1px solid var(--line);
      color: var(--muted);
      width: 30px;
      height: 30px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 13px;
      line-height: 1;
      transition: 0.3s;
    }

    .obj-modal-close:hover {
      color: #fff;
      border-color: var(--obj);
    }
  </style>
</head>

<body>

  <div id="viewport">
    <div class="brand">Golden Trust Financial Group · Academia De Cero a Top Producer</div>
    <div id="map-canvas"></div>
    <div class="nav-ui">
      <button class="nav-btn" onclick="move(-1)">← ANTERIOR</button>
      <button class="nav-btn" onclick="move(1)">SIGUIENTE →</button>
    </div>
  </div>

  <!-- Banco de objeciones -->
  <button class="obj-toggle" onclick="toggleObjPanel()">
    OBJECIONES <span class="obj-count" id="obj-count">0</span>
  </button>

  <div class="obj-panel" id="obj-panel">
    <div class="obj-header">
      <span class="obj-header-title">Banco de Objeciones · Módulo 13</span>
      <button class="obj-close" onclick="toggleObjPanel(false)" title="Cerrar (Esc)">✕</button>
    </div>
    <div class="obj-search-wrap">
      <input type="text" id="obj-search" class="obj-search" placeholder="Buscar objeción o palabra clave…"
        oninput="filterObjections()" autocomplete="off">
    </div>
    <div class="obj-hint">
      <span>Enter abre el primer resultado</span>
      <span id="obj-counter"></span>
    </div>
    <div class="obj-list" id="obj-list"></div>
    <div class="obj-footer">El “no” de hoy puede ser el “sí” de mañana.</div>
  </div>

  <div class="obj-modal" id="obj-modal" onclick="if (event.target === this) closeObjection()">
    <div class="obj-modal-card">
      <button class="obj-modal-close" onclick="closeObjection()" title="Cerrar (Esc)">✕</button>
      <div class="obj-modal-tag" id="obj-modal-tag"></div>
      <h2 class="obj-modal-title" id="obj-modal-title"></h2>
      <div class="obj-meaning-label">Lo que realmente significa</div>
      <div class="obj-meaning" id="obj-modal-meaning"></div>
      <div class="obj-modal-kws" id="obj-modal-kws"></div>
      <div class="obj-response">
        <span class="obj-response-label">Respuesta recomendada</span>
        <div class="obj-response-text" id="obj-modal-body"></div>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // GUIÓN COMPLETO IUL — TOP PRODUCER
    // Golden Trust Financial Group
    // ==========================================
    const scriptData = {
      "script": {
        "name": "Guión Completo IUL — Top Producer",
        "version": "1.0",
        "type": "iul",
        "description": "Guión profesional de venta consultiva IUL — Golden Trust Financial Group · Academia De Cero a Top Producer.",
        "phases": [
          {
            "id": "fase_1",
            "order": 1,
            "title": "Saluda",
            "objective": "Abrir la llamada de forma natural y escuchar antes de continuar.",
            "execution_notes": [
              "Normalmente te dirán quién habla, o ellos preguntarán quién eres. Escucha bien antes de continuar."
            ],
            "script_literal": [
              {
                "step": "saludo",
                "text": "Hola [NOMBRE], ¿cómo estás?"
              }
            ]
          },
          {
            "id": "fase_2",
            "order": 2,
            "title": "Preséntate",
            "objective": "Posicionarte como el profesional financiero que va a ayudarle con lo que él mismo solicitó.",
            "execution_notes": [
              "Termina siempre con una pregunta",
              "Haz validación emocional"
            ],
            "script_literal": [
              {
                "step": "presentacion",
                "text": "Mi nombre es [NOMBRE DEL AGENTE], soy el profesional financiero que te va a ayudar con la información que solicitaste sobre el IUL. ¿Lo recuerdas? ¿Cómo te encuentras el día de hoy?"
              },
              {
                "step": "si_responde_si_o_bien",
                "text": "Perfecto, cuéntame [NOMBRE], ¿qué fue lo que más te gustó de la información que viste sobre el IUL?"
              }
            ],
            "objection_paths": [
              {
                "trigger": "cliente_no_recuerda",
                "label": "Si responde NO / no recuerda",
                "client_says_examples": [
                  "No recuerdo haber solicitado nada",
                  "No sé de qué me hablas"
                ],
                "response_strategy": "Normalizar sin perder frame y re-canalizar el interés con las tres razones más comunes.",
                "response_text": "No te preocupes, [NOMBRE], para eso estoy yo aquí. La mayoría de personas se registran por alguna de estas tres razones: 1) Si tú faltas, tu familia recibe dinero para mantenerse y seguir con su vida tranquila. 2) Si te enfermas de algo serio como cáncer o un infarto, puedes usar parte del dinero en vida. 3) Es un ahorro inteligente donde tu dinero crece de forma segura, sin riesgo de perder y libre de impuestos. ¿Cuál de estas tres partes fue la que más te llamó la atención?"
              }
            ]
          },
          {
            "id": "fase_3",
            "order": 3,
            "title": "Saca el dolor",
            "objective": "Descubrir la motivación real del cliente con preguntas según el interés que eligió. Escucha, toma nota y usa sus respuestas en el cierre.",
            "execution_notes": [
              "Si elige las tres cosas: haz una pregunta de cada bloque",
              "Escucha, toma nota y usa sus respuestas en el cierre"
            ],
            "sub_phases": [
              {
                "id": "fase_3_1",
                "order": "3.1",
                "title": "Proteger a la familia",
                "questions_bank": [
                  {
                    "tag": "PREGUNTAS",
                    "questions": [
                      "¿Quiénes son las personas que, si faltaras, te preocuparía que tengan que batallar?",
                      "¿Qué es lo que más te inquieta cuando piensas en [PERSONA] sin ti?",
                      "Si tú no estuvieras, con lo que hoy tienen, ¿cuánto tiempo podrían sostenerse?",
                      "¿Tienes seguro de vida actualmente?"
                    ]
                  }
                ]
              },
              {
                "id": "fase_3_2",
                "order": "3.2",
                "title": "Protegerse a sí mismo",
                "questions_bank": [
                  {
                    "tag": "PREGUNTAS",
                    "questions": [
                      "¿Alguna vez has pensado qué pasaría si no pudieras trabajar por unos meses?",
                      "¿Quién asumiría tus gastos si una enfermedad fuerte te obliga a parar?",
                      "¿Conoces a alguien que haya pasado por algo así?"
                    ]
                  }
                ]
              },
              {
                "id": "fase_3_3",
                "order": "3.3",
                "title": "Asegurar un buen retiro",
                "questions_bank": [
                  {
                    "tag": "PREGUNTAS",
                    "questions": [
                      "Si hoy pudieras mejorar una sola cosa de tu futuro, ¿cuál sería?",

                      "¿Cómo te gustaría vivir cuando ya no quieras trabajar al mismo ritmo?",
                      "¿Qué sería más valioso: tranquilidad, ingresos, libertad o independencia?"
                    ]
                  }
                ]
              },
              {
                "id": "fase_3_4",
                "order": "3.4",
                "title": "Si elige ahorro",
                "questions_bank": [
                  {
                    "tag": "PREGUNTAS",
                    "questions": [
                      "Normalmente cuando pensamos en ahorro, es porque tenemos un plan... ¿cuál es el tuyo?",
                      "¿Para qué te gustaría usar ese dinero más adelante?",
                      "Si ese ahorro ya estuviera listo hoy, ¿en qué te ayudaría en este momento?"
                    ]
                  }
                ]
              }
            ]
          },
          {
            "id": "fase_4",
            "order": 4,
            "title": "Cierre de descubrimiento",
            "objective": "Validar el dolor del cliente, parafrasear lo que dijo y confirmar que no queda nada fuera.",
            "execution_notes": [
              "Parafrasea el dolor con las palabras del cliente, no las tuyas"
            ],
            "script_literal": [
              {
                "step": "cierre_descubrimiento",
                "text": "Quiero asegurarme de que este plan realmente esté hecho a tu medida, [NOMBRE], porque lo que me acabas de decir es muy importante. Entonces, vamos a construir algo para que [PARAFRASEAS SU DOLOR] puedas tener cubierto eso que hoy te preocupa, tanto en el presente como en el futuro. ¿Hay algo más que te preocupe o que quieras que yo considere?"
              }
            ]
          },
          {
            "id": "fase_5",
            "order": 5,
            "title": "Lo que va a pasar en la llamada",

            "execution_notes": [
              "Confirma tu NPN al enviar las credenciales"

            "script_literal": [
              {
                "step": "encuadre",
                "text": "Perfecto, [NOMBRE]. Te explico cómo vamos a trabajar en esta llamada para que tengamos claridad desde el inicio."
              },
              {
                "step": "primero_credenciales",
                "text": "Primero: te estoy enviando por mensaje mis credenciales para que tengas total tranquilidad de quién te está acompañando."
              },
              {
                "step": "segundo_calificacion",
                "text": "Segundo: este producto no es de acceso masivo. Hay que calificar primero — eso es lo que vamos a hacer ahora."
              },
              {
                "step": "tercero_perfil",
                "text": "Lo siguiente es entender bien tu perfil y estructurarlo de la mejor manera para ti."
              }
            ]
          },
          {
            "id": "fase_6",
            "order": 6,
            "title": "Califica",
            "objective": "Levantar salud, estatus legal e ingresos para colocar al cliente correctamente, y anclar el monto del aporte con prueba social.",
            "execution_notes": [
              "Si la diferencia entre ingresos y gastos es menos del 10%, haz la recomendación directamente. Si no, deja que el cliente proponga el monto"
            ],
            "script_literal": [
              {
                "step": "introduccion",
                "text": "Perfecto, [NOMBRE]. Ahora te voy a hacer unas preguntas muy sencillas sobre tu salud. Es muy importante que seas totalmente sincero conmigo, porque de esto depende directamente tu aplicación."
              }
            ],
            "sub_phases": [
              {
                "id": "fase_6_1",
                "order": "6.1",
                "title": "Salud",

    function buildMap() {
      const data = scriptData.script;
      const canvas = document.getElementById('map-canvas');
      canvas.innerHTML = '';

      data.phases.forEach((phase, index) => {
        const node = document.createElement('div');
        node.id = `node-${index}`;
        node.className = 'node';

        // Posicionamiento dinámico
        const posX = 3000 + (index * 1300);
        const posY = 3000 + (index % 2 * 60);
        node.style.left = `${posX}px`;
        node.style.top = `${posY}px`;
        node.style.width = phase.sub_phases ? "1100px" : "500px";

        let html = `<div class="card-tag">FASE ${phase.order} — ${phase.title}</div>`;

        if (phase.objective) {
          html += `<div class="objective">${phase.objective}</div>`;
        }

        if (phase.execution_notes) {
          phase.execution_notes.forEach(n => {
            html += `<div class="exec-note">${n}</div>`;
          });
        }

        if (phase.script_literal) {
          html += `<div class="script-box">`;
          phase.script_literal.forEach(line => {
            html += `<span class="instruction">${line.step.replaceAll('_', ' ')}</span>`;
            html += `<span class="literal">${line.text}</span>`;
          });
          html += `</div>`;
        }

        if (phase.sub_phases) {
          html += `<div class="subphase-container">`;
          phase.sub_phases.forEach(sp => {
            html += `
          <div class="sub-card">
            <div class="card-tag">${sp.order}</div>
            <div style="font-weight:600; font-size:13px; margin-bottom:10px;">${sp.title}</div>
            ${sp.questions_bank ? sp.questions_bank.map(bank => `
              <div style="margin-top:8px">
                <span class="instruction">${bank.tag}</span>
                ${bank.questions.map(q => `<div class="q-item">• ${q}</div>`).join('')}
              </div>
            `).join('') : ''}
          </div>`;
          });
          html += `</div>`;
        }

        if (phase.objection_paths) {
          html += `
        <div class="script-box" style="border-left-color: #e07b6a; background: rgba(224, 123, 106, 0.05);">
          <span class="instruction" style="color:#e07b6a;">${phase.objection_paths[0].label || 'Si hay objeción:'}</span>
          <span class="literal" style="font-size:0.95rem;">${phase.objection_paths[0].response_text}</span>
        </div>`;
        }

        node.innerHTML = html;
        canvas.appendChild(node);
      });

      totalNodes = data.phases.length;
      update();
    }

    function update() {
      const node = document.getElementById(`node-${current}`);
      if (!node) return;
      const canvas = document.getElementById('map-canvas');

      const offsetX = (window.innerWidth / 2) - (parseInt(node.style.left) + (node.offsetWidth / 2));
      const offsetY = (window.innerHeight / 2) - (parseInt(node.style.top) + (node.offsetHeight / 2));

      canvas.style.transform = `translate(${offsetX}px, ${offsetY}px)`;

      document.querySelectorAll('.node').forEach((n, i) => {
        n.classList.toggle('active', i === current);
      });
    }

    function move(dir) {
      current = Math.max(0, Math.min(totalNodes - 1, current + dir));
      update();
    }

    // ==========================================
    // LÓGICA — BANCO DE OBJECIONES
    // ==========================================
    let visibleObjections = [...objectionsData];

    const normTxt = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    const padNum = n => '#' + String(n).padStart(2, '0');

    function renderObjections(list) {
      const cont = document.getElementById('obj-list');
      cont.innerHTML = '';

      if (!list.length) {
        cont.innerHTML = '<div class="obj-empty">Sin resultados para esa búsqueda.<br>Prueba con otra palabra clave.</div>';
      }

      list.forEach(obj => {
        const btn = document.createElement('button');
        btn.className = 'obj-item';
        btn.onclick = () => openObjection(obj.n);
        btn.innerHTML = `
          <span class="obj-num">${padNum(obj.n)}</span>
          <span>
            <span class="obj-item-title">${obj.titulo}</span>
            <div class="obj-kws">${obj.keywords.join(' · ')}</div>
          </span>`;
        cont.appendChild(btn);
      });

      document.getElementById('obj-counter').textContent = `${list.length} / ${objectionsData.length}`;
    }

    function filterObjections() {
      const q = normTxt(document.getElementById('obj-search').value.trim());
      if (!q) {
        visibleObjections = [...objectionsData];
      } else {
        const tokens = q.split(/\s+/);
        visibleObjections = objectionsData.filter(o => {
          const hay = normTxt(o.titulo + ' ' + o.keywords.join(' '));
          return tokens.every(t => hay.includes(t));
        });
      }
      renderObjections(visibleObjections);
    }

    function openObjection(n) {
      const obj = objectionsData.find(o => o.n === n);
      if (!obj) return;
      document.getElementById('obj-modal-tag').textContent = 'Objeción ' + padNum(obj.n);
      document.getElementById('obj-modal-title').textContent = obj.titulo;
      document.getElementById('obj-modal-meaning').textContent = obj.significado;
      document.getElementById('obj-modal-kws').innerHTML =
        obj.keywords.map(k => `<span class="kw-chip">${k}</span>`).join('');
      document.getElementById('obj-modal-body').textContent = obj.respuesta;
      document.getElementById('obj-modal').classList.add('open');
    }

    function closeObjection() {
      document.getElementById('obj-modal').classList.remove('open');
    }

    function toggleObjPanel(force) {
      const panel = document.getElementById('obj-panel');
      const open = (force !== undefined) ? force : !panel.classList.contains('open');
      panel.classList.toggle('open', open);
      if (open) {
        setTimeout(() => document.getElementById('obj-search').focus(), 300);
      }
    }

    function initObjections() {
      document.getElementById('obj-count').textContent = objectionsData.length;
      renderObjections(visibleObjections);
    }

    // ==========================================
    // TECLADO — mapa + objeciones
    // ==========================================
    document.addEventListener('keydown', e => {
      const modalOpen = document.getElementById('obj-modal').classList.contains('open');
      const panelOpen = document.getElementById('obj-panel').classList.contains('open');

      if (e.key === 'Escape') {
        if (modalOpen) { closeObjection(); return; }
        if (panelOpen) { toggleObjPanel(false); return; }
      }

      // Mientras se escribe en el buscador, las flechas no mueven el mapa
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) {
        if (e.key === 'Enter' && e.target.id === 'obj-search' && visibleObjections.length) {
          openObjection(visibleObjections[0].n);
        }
        return;
      }

      if (modalOpen) return;

      if (e.key === 'ArrowRight') move(1);
      if (e.key === 'ArrowLeft') move(-1);
    });

    window.onload = () => {
      buildMap();
      initObjections();
    };
    window.onresize = update;
  </script>
</body>

</html>
